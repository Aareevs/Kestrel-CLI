# GoReleaser v2. See docs/releasing.md.
#
# Local dry run (builds everything, publishes nothing):
#   make release-snapshot
#
# A real release runs only from .github/workflows/release.yml when a v* tag is
# pushed, and creates a DRAFT GitHub release: nothing is public until someone
# publishes the draft by hand.
version: 2

project_name: kestrel

builds:
  - id: kestrel
    main: ./cmd/kestrel
    binary: kestrel
    env:
      - CGO_ENABLED=0 # modernc.org/sqlite is pure Go
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/Aareevs/Kestrel-CLI/internal/buildinfo.Version={{ .Version }}
      - -X github.com/Aareevs/Kestrel-CLI/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/Aareevs/Kestrel-CLI/internal/buildinfo.Date={{ .CommitDate }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: kestrel
    # scripts/install.sh depends on this name: kestrel_<version>_<os>_<arch>
    name_template: "kestrel_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs"
      - "^test"
      - "^Merge"

release:
  github:
    owner: Aareevs
    name: Kestrel-CLI
  draft: true
  replace_existing_draft: true

# Homebrew cask (GoReleaser v2 replaced `brews` formulas with casks). It is
# pushed to github.com/Aareevs/homebrew-tap, which must exist first; see
# docs/releasing.md.
homebrew_casks:
  - name: kestrel
    repository:
      owner: Aareevs
      name: homebrew-tap
      token: '{{ envOrDefault "HOMEBREW_TAP_TOKEN" "" }}'
    directory: Casks
    homepage: https://github.com/Aareevs/Kestrel-CLI
    description: Local-first debugging CLI that reconstructs what broke in your dev stack, with evidence
    license: MIT
    commit_author:
      name: Aareevs
      email: noreply@github.com
    # The binaries are not notarized; without this, macOS Gatekeeper blocks
    # the first run of a downloaded binary.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kestrel"]
          end
