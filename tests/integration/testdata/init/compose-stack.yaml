# kestrel.yaml, generated by `kestrel init` from project discovery.
# Each service notes where it was detected. Review the guesses before relying on them.
# Reference: docs/configuration.md
version: 1
project:
  name: compose-stack
services:
  # redis · compose.yaml:8 · confidence high
  - name: cache
    command: docker compose up cache
    health:
      type: tcp
      address: localhost:6379
  # postgres · compose.yaml:2 · confidence high
  - name: db
    command: docker compose up db
    health:
      type: tcp
      address: localhost:5432
  # go · compose.yaml:12 · confidence high
  - name: api
    dir: ./api
    command: docker compose -f ../compose.yaml up api
    depends_on: [db, cache]
    health:
      type: http
      url: http://localhost:8080/health
  # node (next) · compose.yaml:22 · confidence high
  - name: web
    dir: ./web
    command: docker compose -f ../compose.yaml up web
    depends_on: [api]
    health:
      type: http
      url: http://localhost:3000/
